
name: Qrypt npm release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: Version exactly matching package.json
        required: true
        type: string
      confirmation:
        description: Type PUBLISH-QRYPT to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qrypt-npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PUBLISH-QRYPT')
    runs-on: ubuntu-latest
    environment: npm-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Validate release version
        id: release
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="$MANUAL_VERSION"
          fi

          if [[ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Version mismatch: release=$RELEASE_VERSION package=$PACKAGE_VERSION"
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Validated Qrypt version $RELEASE_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run check:release

      - name: Publish Qrypt
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          QRYPT_PUBLISH_APPROVED: 'yes'
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node .workflow/publish.mjs \
            --publish \
            --confirm="@blcklab/qrypt@$RELEASE_VERSION"
