name: Qrypt npm preview release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved package version exactly matching package.json
        required: true
        type: string
      confirmation:
        description: Type PUBLISH-QRYPT to confirm a manually approved preview release
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.confirmation == 'PUBLISH-QRYPT' }}
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Publish approved preview
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          QRYPT_PUBLISH_APPROVED: 'yes'
          RELEASE_VERSION: ${{ inputs.version }}
        run: node .workflow/publish.mjs --publish --confirm="@blcklab/qrypt@$RELEASE_VERSION"
